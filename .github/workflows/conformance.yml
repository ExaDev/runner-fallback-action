name: Conformance

# Manual end-to-end exercise of the runner-fallback action against the live
# heartbeat gist. To force the fallback path, dispatch with a gist-id whose
# content is stale or missing (e.g. a freshly-created empty gist), or run
# while the M3 Mac / k3s / ARC controller is intentionally stopped so the
# heartbeat timestamp goes stale.
#
# NOTE on determine-runner's own runs-on: this job is TEMPORARILY anchored on
# the ARC scale set directly, not ubuntu-latest as the README's Setup section
# recommends for real workflows. This is a deliberate, temporary deviation
# while ExaDev's GitHub-hosted runners are blocked by an account billing
# issue -- anchoring here on the (currently more reliable) self-hosted pool
# unblocks testing this action at all. It sacrifices the safety net this
# action exists to provide: if the self-hosted pool ever goes down while
# anchored this way, this job cannot run and cannot fall back to hosted --
# see the README's "Why the bootstrap job stays on ubuntu-latest" section.
# Revert to runs-on: ubuntu-latest once ExaDev's billing issue is resolved.
on:
  workflow_dispatch:
    inputs:
      gist-id:
        description: 'ID of the heartbeat gist to read (override with a stale/empty gist to force the fallback path)'
        required: true
        type: string
        default: '6d3da191f6fa5ed67282d528c3977e75'
      preferred-labels:
        description: 'ARC runner scale set name, e.g. exadev-runners'
        required: true
        type: string
        default: 'exadev-runners'
      fallback-labels:
        description: 'Comma-separated fallback labels, e.g. ubuntu-latest'
        required: true
        type: string
        default: 'ubuntu-latest'

jobs:
  determine-runner:
    runs-on: exadev-runners
    outputs:
      selected-runner: ${{ steps.fallback.outputs.selected-runner }}
      preferred-available: ${{ steps.fallback.outputs.preferred-available }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine runner
        id: fallback
        uses: ./
        with:
          gist-id: ${{ inputs.gist-id }}
          preferred-labels: ${{ inputs.preferred-labels }}
          fallback-labels: ${{ inputs.fallback-labels }}

  confirm:
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    steps:
      - name: Report selected runner
        run: |
          echo "Selected runner labels: ${{ needs.determine-runner.outputs.selected-runner }}"
          echo "Preferred pool available: ${{ needs.determine-runner.outputs.preferred-available }}"
