name: Debug Vars
on: workflow_dispatch
jobs:
  debug:
    runs-on: [self-hosted, linux, ARM64, act-latest, m3]
    steps:
      - name: Print vars
        run: |
          echo "RUNNER_FALLBACK_APP_ID=[${{ vars.RUNNER_FALLBACK_APP_ID }}]"
          echo "PREFERRED_LABELS=[${{ vars.PREFERRED_LABELS }}]"
          echo "has secret: [${{ secrets.RUNNER_FALLBACK_APP_PRIVATE_KEY != '' }}]"
