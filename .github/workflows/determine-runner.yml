name: determine-runner

# A reusable workflow consumers call to route CI to ExaDev's self-hosted ARC fleet
# (exadev-runners) when it's healthy, falling back to ubuntu-latest otherwise.
#
# This centralises the GitHub App token mint + runner-fallback-action call so that the
# RUNNER_FALLBACK_APP_* credential lives ONLY in this repo (its secrets/vars, already set
# and consumed by conformance.yml), instead of being copied into every consumer repo.
# Consumers call this workflow with a one-line `uses:` and need no secret of their own.
#
# Why a reusable workflow rather than the composite action alone: the composite action
# (action.yml) takes a `token` input the caller must mint, which forces every consumer to
# hold the App credential. A reusable workflow can access secrets defined in its OWN repo
# (the called repo), so the mint happens here against this repo's secret and the caller
# passes nothing sensitive. The `github` context inside a called workflow reflects the
# CALLER's run, so github.repository_owner / github.actor /
# github.event.pull_request.head.repo.fork all resolve to the consumer's event and the
# Dependabot/fork guards behave correctly per consumer.
on:
  workflow_call:
    outputs:
      selected-runner:
        description: 'JSON array of label strings for the downstream runs-on (via fromJson).'
        value: ${{ jobs.determine-runner.outputs.selected-runner }}
      preferred-available:
        description: '"true" if the self-hosted fleet is healthy, else "false".'
        value: ${{ jobs.determine-runner.outputs.preferred-available }}

jobs:
  determine-runner:
    # TEMPORARILY anchored on the self-hosted scale set rather than ubuntu-latest because
    # ExaDev's GitHub-hosted runners are blocked by an account billing issue - anchoring on
    # ubuntu-latest here would mean this job, and therefore any workflow calling it, could
    # never start. This sacrifices the fallback safety net for as long as it's in place.
    # Revert to runs-on: ubuntu-latest once billing is resolved.
    runs-on: exadev-runners
    timeout-minutes: 5
    outputs:
      selected-runner: ${{ steps.fallback.outputs.selected-runner || '["ubuntu-latest"]' }}
      preferred-available: ${{ steps.fallback.outputs.preferred-available || 'false' }}
    steps:
      # Dependabot runs and fork PRs don't receive Actions secrets, so the token mint would
      # fail with an empty private-key before it could run. Skip both steps in that case;
      # the outputs above fall back to ubuntu-latest via the || defaults.
      - name: Mint installation token
        if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RUNNER_FALLBACK_APP_ID }}
          private-key: ${{ secrets.RUNNER_FALLBACK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Determine runner
        if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true
        id: fallback
        # Pinned to a commit SHA, not @main - this runs with a live GitHub App installation
        # token, so a floating ref would let any future push to this repo's default branch
        # execute with that credential on every consumer run. NB: must use the full
        # coordinate (ExaDev/runner-fallback-action@<sha>), NOT uses: ./ - a reusable workflow
        # runs in the CALLER's workspace, so a local ./ path would resolve to the caller's
        # repo, not this one. Bump deliberately when the action's code changes.
        # (46fe9d3 = the ARC heartbeat health-check redesign.)
        uses: ExaDev/runner-fallback-action@46fe9d306d95287875aeedf5730877b097d38153
        with:
          org: ${{ github.repository_owner }}
          token: ${{ steps.app-token.outputs.token }}
          # preferred-labels/fallback-labels intentionally omitted - the action's own
          # built-in defaults (exadev-runners, falling back to ubuntu-latest) are what
          # every consumer wants.
