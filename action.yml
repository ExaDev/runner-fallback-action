name: 'Self-Hosted Runner Availability Fallback'
description: >-
  Checks whether an organization's self-hosted CI infrastructure is
  currently healthy (via a heartbeat variable), and falls back to a
  GitHub-hosted (or other) label set when it is not.
author: 'ExaDev'

inputs:
  org:
    description: 'The GitHub organization whose infrastructure health should be checked.'
    required: true
  preferred-labels:
    description: >-
      Comma-separated list of labels/runs-on target to use when the
      organization's self-hosted infrastructure is healthy, e.g.
      exadev-runners (an ARC runner scale set name). Defaults to ExaDev's
      own scale set if omitted or left empty (e.g. because an org variable
      didn't resolve).
    required: false
    default: 'exadev-runners'
  fallback-labels:
    description: >-
      Comma-separated list of labels to use when the preferred
      infrastructure is unhealthy, e.g. ubuntu-latest. Defaults to
      ubuntu-latest if omitted or left empty.
    required: false
    default: 'ubuntu-latest'
  token:
    description: >-
      A token carrying read access to the organization's Actions variables
      (used to read the ARC_HEALTHY_UNTIL heartbeat variable). Consumed as
      given; this action does not mint, refresh, or validate its scope
      beyond what the API call itself reveals.
    required: true

outputs:
  selected-runner:
    description: >-
      A JSON-encoded array of label strings, for a downstream job's
      runs-on via fromJson(...). Always an array, even for a single label.
    value: ${{ steps.determine.outputs.selected-runner }}
  preferred-available:
    description: '"true" or "false" - whether the preferred pool was available, reported for observability.'
    value: ${{ steps.determine.outputs.preferred-available }}

runs:
  using: 'composite'
  steps:
    - name: Determine runner availability
      id: determine
      shell: bash
      env:
        ORG: ${{ inputs.org }}
        PREFERRED_LABELS: ${{ inputs.preferred-labels }}
        FALLBACK_LABELS: ${{ inputs.fallback-labels }}
        TOKEN: ${{ inputs.token }}
      run: ${{ github.action_path }}/scripts/determine-runner.sh
